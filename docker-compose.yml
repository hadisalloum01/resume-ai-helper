services:
  postgres:
    image: postgres:17
    container_name: resume-ai-postgres
    environment:
      POSTGRES_DB: resume_ai
      POSTGRES_USER: resume_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - resume_ai_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_user -d resume_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resume_ai_data:
